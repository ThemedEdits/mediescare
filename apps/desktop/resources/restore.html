<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Restore from backup</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; color: #0f172a; background: #fff; }
      main { max-width: 520px; margin: 0 auto; padding: 28px 24px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      p { color: #475569; margin: 0 0 16px; }
      .warn { background: #fef3c7; color: #7c2d12; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
      label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 4px; }
      input[type='text'] { width: 100%; height: 44px; border: 1px solid #94a3b8; border-radius: 6px; padding: 0 12px; font-size: 16px; font-family: Consolas, monospace; }
      .row { display: flex; gap: 8px; }
      .row input { flex: 1; }
      button { height: 44px; border: 0; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
      .primary { background: #1b709c; color: #fff; width: 100%; margin-top: 18px; }
      .primary:hover { background: #18638b; }
      .primary:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
      .secondary { background: #fff; color: #1b709c; border: 1px solid #1b709c; padding: 0 16px; }
      #msg { min-height: 22px; margin-top: 10px; font-size: 14px; }
      .err { color: #b91c1c; } .ok { color: #2f7d32; }
      .check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Restore from backup</h1>
      <p class="warn">This replaces all current data on this computer with the backup. A safety copy of the current data is kept first.</p>
      <label for="file">Backup file (.mcbak)</label>
      <div class="row">
        <input type="text" id="file" readonly placeholder="Choose a backup file" />
        <button type="button" class="secondary" id="pick">Browse…</button>
      </div>
      <label for="key">Recovery key</label>
      <input type="text" id="key" placeholder="ABCD-EFGH-JKMN-PQRS-TVWX-YZ01-2345-6789" autocomplete="off" spellcheck="false" />
      <label class="check"><input type="checkbox" id="same" /> This backup was made on this computer and its data key is still here (no recovery key needed).</label>
      <div id="msg" role="alert"></div>
      <button type="button" class="primary" id="go" disabled>Restore now</button>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const update = () => { $('go').disabled = !$('file').value || (!$('same').checked && !$('key').value.trim()); };
      $('pick').onclick = async () => { const p = await window.mediescare.pickBackup(); if (p) { $('file').value = p; update(); } };
      $('key').oninput = update; $('same').onchange = () => { $('key').disabled = $('same').checked; update(); };
      $('go').onclick = async () => {
        $('go').disabled = true; $('msg').className = ''; $('msg').textContent = 'Restoring…';
        const r = await window.mediescare.restoreBackup({ backupPath: $('file').value, recoveryKey: $('key').value, sameKey: $('same').checked });
        if (r.ok) { $('msg').className = 'ok'; $('msg').textContent = 'Restored. Mediescare will restart.'; }
        else { $('msg').className = 'err'; $('msg').textContent = r.error || 'Restore failed'; update(); }
      };
    </script>
  </body>
</html>
