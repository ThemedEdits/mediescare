name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The 50k-item scale tests measure speed for real pharmacy PCs; shared CI runners are about 2.5x
      # slower and vary, so they run locally (pnpm test, pnpm bench) and not here.
      - run: pnpm test
        env:
          SKIP_SCALE: '1'
      - run: pnpm --filter @mediescare/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  package-smoke:
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mediescare/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm --filter @mediescare/desktop package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm --filter @mediescare/desktop smoke
      - run: pnpm --filter @mediescare/desktop test:e2e

  # Every push to main that passes the checks above becomes a GitHub Release. Installed apps see it
  # within a few hours (or at once with Help > Check for updates) and offer to install it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    needs: [verify, package-smoke]
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set release version
        id: version
        shell: bash
        run: echo "version=$(node scripts/ci-version.mjs)" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @mediescare/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # Same command as a local "pnpm package": installer + latest.yml (the update feed).
      - name: Build installer
        run: pnpm --filter @mediescare/desktop package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Mediescare ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            release/Mediescare-Setup-${{ steps.version.outputs.version }}.exe
            release/Mediescare-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            release/latest.yml
